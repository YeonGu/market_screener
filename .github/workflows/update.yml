name: update

on:
  schedule:
    # GitHub 的定时是尽力而为：整点排队最严重，常延迟数小时或直接丢。错开整点 + 一个备份时刻；
    # 重复跑是幂等的（没有新交易日就拉 0 天、名单不变）
    - cron: "23 9 * * 2-6"      # UTC 09:23 周二–周六 = 美东前一交易日收盘后
    - cron: "41 13 * * 2-6"     # 备份
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["cache/**", "README.md"]

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: write      # 回写 cache/sic.csv
  actions: write       # 删除旧的 Actions cache
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150     # 冷启动要拉约 270 天日线（免费档 5 次/分钟 ≈ 1 小时）
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Polygon 原始日线不进 git，放 Actions cache；每次存一个新 key，恢复最近的一个
      - name: restore data
        uses: actions/cache/restore@v4
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: fetch
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python fetch.py

      - name: save data
        if: always()               # 冷启动中途失败也把已拉到的天数存下来
        uses: actions/cache/save@v4
        with:
          path: data
          key: data-${{ github.run_id }}

      - name: build
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          MS_SITE_URL: https://yeongu.github.io/market_screener   # 缓存丢失时从这里取上一期
        run: python build.py

      # data/ 里现在也有滚动的历史名单，build 之后再存一次（覆盖 fetch 之后那次）
      - name: save data (with history)
        uses: actions/cache/save@v4
        with:
          path: data
          key: data-${{ github.run_id }}-h

      - name: prune old caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key data- --sort created_at --order desc --limit 100 \
            --json id --jq '.[2:][].id' | xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY"
          gh cache list --repo "$GITHUB_REPOSITORY"

      - name: commit sic cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache/sic.csv
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "sic: $(ls data/history | tail -1 | sed 's/watchlist_//; s/.csv//')"
          git pull --rebase
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
