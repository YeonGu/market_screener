name: update

on:
  schedule:
    - cron: "0 10 * * 2-6"      # UTC 10:00 周二–周六 = 美东前一交易日收盘后
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["history/**", "cache/**", "README.md"]

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: write      # 回写 history/ 与 cache/sic.csv
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150     # 冷启动要拉约 270 天日线（免费档 5 次/分钟 ≈ 1 小时）
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Polygon 原始日线不进 git，放 Actions cache；每次存一个新 key，恢复最近的一个
      - name: restore data
        uses: actions/cache/restore@v4
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: fetch
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python fetch.py

      - name: save data
        if: always()               # 冷启动中途失败也把已拉到的天数存下来
        uses: actions/cache/save@v4
        with:
          path: data
          key: data-${{ github.run_id }}

      - name: build
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python build.py

      - name: commit history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history cache/sic.csv
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "data: $(ls history | tail -1 | sed 's/watchlist_//; s/.csv//')"
          git pull --rebase
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
